name: Delete batch releases

# One-off. Batches used to be kept as batch-* releases, which held a second copy of every
# MP4 that is already on its own episode release. Five of them had reached 228 MB. Batches
# are run artifacts now and expire on their own, so these are deleted. Nothing is lost:
# each video is still on episode-<CODE>, and a batch is rebuilt by running it again.
# Delete this file once it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every batch-* release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name | startswith("batch-")) | .tag_name' > tags.txt
          echo "batch releases: $(wc -l < tags.txt)"
          # Both deletes go through the API. 'gh release delete --cleanup-tag' shells out to
          # git for the tag, and this job has no checkout, so it failed on every release
          # while the step still reported success.
          while read -r tag; do
            [ -n "$tag" ] || continue
            # episode-* must never be touched: those are the rendered videos themselves.
            case "$tag" in batch-*) ;; *) echo "refusing $tag" >&2; continue ;; esac
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')
            gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
            echo "  deleted $tag"
          done < tags.txt
          # Check the work rather than trust it: the first run of this said success and had
          # deleted nothing.
          left=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name | startswith("batch-")) | .tag_name' | wc -l)
          kept=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name | startswith("episode-")) | .tag_name' | wc -l)
          echo "batch releases left: $left · episode releases untouched: $kept"
          [ "$left" -eq 0 ] || { echo "batch releases survived" >&2; exit 1; }
