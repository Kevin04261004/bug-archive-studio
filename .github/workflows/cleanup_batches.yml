name: Delete batch releases

# One-off. Batches used to be kept as batch-* releases, which held a second copy of every
# MP4 that is already on its own episode release. Five of them had reached 228 MB. Batches
# are run artifacts now and expire on their own, so these are deleted. Nothing is lost:
# each video is still on episode-<CODE>, and a batch is rebuilt by running it again.
# Delete this file once it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every batch-* release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name | startswith("batch-")) | .tag_name' > tags.txt
          echo "batch releases: $(wc -l < tags.txt)"
          while read -r tag; do
            [ -n "$tag" ] || continue
            # episode-* must never be touched: those are the rendered videos themselves.
            case "$tag" in batch-*) ;; *) echo "refusing $tag" >&2; continue ;; esac
            gh release delete "$tag" -y --cleanup-tag && echo "  deleted $tag"
          done < tags.txt
          left=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.tag_name | startswith("batch-"))] | length' | paste -sd+ | bc)
          echo "batch releases left: $left"
          episodes=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.tag_name | startswith("episode-"))] | length' | paste -sd+ | bc)
          echo "episode releases untouched: $episodes"
