name: Render episodes

on:
  push:
    branches: [main]
    paths:
      - 'episodes/*.json'
      - 'assets/*.png'
      - 'render.py'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Error codes to render, space separated, or all'
        default: all

permissions:
  contents: write

# One group per commit, not one for the whole repository. A single-episode render from the page
# used to queue behind a batch of thirty-six and wait eight minutes before it even started.
# Runs can now overlap; the index refresh below rebases and retries, so concurrent pushes are fine.
concurrency:
  group: render-${{ github.sha }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Work out which episodes to render
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.episode }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python .github/workflows/pick_episodes.py >> "$GITHUB_OUTPUT"

      # A batch from the studio arrives as one run, so a single bad episode must not throw
      # away the ones that already rendered. Failures are collected and reported at the end,
      # after everything that did render has been uploaded.
      - name: Render
        if: steps.pick.outputs.codes != ''
        id: render
        run: |
          mkdir -p output
          : > output/rendered.txt
          failed=''
          for code in ${{ steps.pick.outputs.codes }}; do
            echo "::group::$code"
            # The page downloads the MP4 straight from the release. That host sends no CORS
            # header, so the page cannot read the bytes and rename them: whatever the release
            # asset is called is what lands in the viewer's downloads. The file therefore
            # carries its final, upload-ready title from here on.
            if python render.py "episodes/$code.json" --output "output/C# QUIZ - ERROR $code.mp4"; then
              echo "$code" >> output/rendered.txt
            else
              echo "::error title=$code::render.py could not render this episode."
              failed="$failed $code"
            fi
            echo "::endgroup::"
          done
          echo "rendered: $(wc -l < output/rendered.txt)"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Attach each MP4 to its own release
        if: steps.pick.outputs.codes != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets get a name without '#' or spaces. Two reasons, both hard:
          # gh reads 'file#label' so a '#' in the path truncates it, and GitHub rewrites
          # characters it does not allow in an asset name anyway, which turned
          # 'C# QUIZ - ERROR CS1002.mp4' into 'C.QUIZ.-.ERROR.CS1002.mp4'. C# is written
          # CS here, the way the language already spells itself in .cs and in CS0000.
          # The readable title survives where it can be kept: on disk, and in the archive.
          mkdir -p upload
          for code in $(cat output/rendered.txt); do
            tag="episode-$code"
            mp4="CS-QUIZ-ERROR-$code.mp4"; png="CS-QUIZ-ERROR-$code-locked.png"
            cp "output/C# QUIZ - ERROR $code.mp4" "upload/$mp4"
            cp "output/C# QUIZ - ERROR $code-locked.png" "upload/$png"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$code" --notes "Rendered from episodes/$code.json by render.py."
            # Upload first, prune second. Clearing the release before the upload once left an
            # episode with no assets at all when the upload then failed.
            gh release upload "$tag" "upload/$mp4" "upload/$png" --clobber
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq ".assets[] | select(.name != \"$mp4\" and .name != \"$png\") | .id" |
              while read -r id; do gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name' | sed "s/^/  $code asset: /"
          done

      # A batch exists to be uploaded in one go. YouTube Studio takes many files at once and
      # fills each title from its file name, so the names have to survive the trip. GitHub
      # rewrites characters it does not allow in release asset names, but it does not touch
      # names inside an archive, so the batch travels as one.
      #
      # It goes out as a run artifact, not a release. Every MP4 in it is already on its own
      # episode release, so a kept copy is the same footage stored twice; five batches had
      # piled up to 228 MB of duplicates. An artifact expires on its own, so picking a batch
      # up stays easy without anything accumulating.
      - name: Pack the batch for one upload
        if: steps.pick.outputs.codes != ''
        id: pack
        run: |
          count=$(wc -l < output/rendered.txt)
          if [ "$count" -lt 2 ]; then echo 'One episode: no archive needed.'; exit 0; fi
          # Videos at the top, thumbnails one level down. Selecting everything in the folder
          # then has to be the videos, which is what the upload dialog wants.
          mkdir -p pack/thumbnails
          for code in $(cat output/rendered.txt); do
            title="C# QUIZ - ERROR $code"
            cp "output/$title.mp4" "pack/$title.mp4"
            cp "output/$title-locked.png" "pack/thumbnails/$title.png"
          done
          python .github/workflows/batch_titles.py output/rendered.txt pack/titles.tsv
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload the batch
        if: steps.pack.outputs.count != ''
        uses: actions/upload-artifact@v4
        with:
          name: bug-archive-batch
          path: pack/
          retention-days: 3
          compression-level: 0

      - name: Report the episodes that failed
        if: steps.render.outputs.failed != ''
        run: |
          echo 'These episodes did not render:${{ steps.render.outputs.failed }}' >&2
          exit 1

      # Runs even when an episode failed above: the list is about what is in episodes/,
      # not about what rendered, and everyone else's page reads it.
      - name: Refresh the episode and music lists for GitHub Pages
        if: always()
        run: |
          python server.py --index
          git add episodes/index.json music/index.json
          if git diff --cached --quiet; then echo 'Episode list already current.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '에피소드 목록 갱신 [skip ci]'
          # The studio pushes to main too, and GitHub sometimes answers 500 here.
          # Rebase and retry instead of failing the whole render on a lost race.
          for wait in 0 5 15 30 60; do
            sleep "$wait"
            git fetch origin main || continue
            git rebase origin/main || { git rebase --abort || true; continue; }
            git push origin HEAD:main && exit 0
          done
          echo 'Could not push the refreshed episode list after 5 tries.' >&2
          exit 1
