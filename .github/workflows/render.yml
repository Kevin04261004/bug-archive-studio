name: Render episodes

on:
  push:
    branches: [main]
    paths:
      - 'episodes/*.json'
      - 'assets/*.png'
      - 'render.py'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Error code to render, or all'
        default: all

permissions:
  contents: write

# One group per commit, not one for the whole repository. A single-episode render from the page
# used to queue behind a batch of thirty-six and wait eight minutes before it even started.
# Runs can now overlap; the index refresh below rebases and retries, so concurrent pushes are fine.
concurrency:
  group: render-${{ github.sha }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Work out which episodes to render
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.episode }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python .github/workflows/pick_episodes.py >> "$GITHUB_OUTPUT"

      - name: Render
        if: steps.pick.outputs.codes != ''
        run: |
          for code in ${{ steps.pick.outputs.codes }}; do
            echo "::group::$code"
            # The page downloads the MP4 straight from the release, and a cross-origin download
            # cannot be renamed by the browser. So the file carries its final name from here on.
            python render.py "episodes/$code.json" --output "output/[ERROR] $code.mp4"
            echo "::endgroup::"
          done

      - name: Attach each MP4 to its own release
        if: steps.pick.outputs.codes != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for code in ${{ steps.pick.outputs.codes }}; do
            tag="episode-$code"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$code" --notes "Rendered from episodes/$code.json by render.py."
            # Drop the old naming so a release never carries two MP4s; the page picks the first it finds.
            gh release delete-asset "$tag" "$code-bug-archive.mp4" -y 2>/dev/null || true
            gh release delete-asset "$tag" "$code-bug-archive-locked.png" -y 2>/dev/null || true
            gh release upload "$tag" "output/[ERROR] $code.mp4" "output/[ERROR] $code-locked.png" --clobber
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name' | sed "s/^/  $code asset: /"
          done

      - name: Refresh the episode and music lists for GitHub Pages
        run: |
          python server.py --index
          git add episodes/index.json music/index.json
          if git diff --cached --quiet; then echo 'Episode list already current.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '에피소드 목록 갱신 [skip ci]'
          # The studio pushes to main too, and GitHub sometimes answers 500 here.
          # Rebase and retry instead of failing the whole render on a lost race.
          for wait in 0 5 15 30 60; do
            sleep "$wait"
            git fetch origin main || continue
            git rebase origin/main || { git rebase --abort || true; continue; }
            git push origin HEAD:main && exit 0
          done
          echo 'Could not push the refreshed episode list after 5 tries.' >&2
          exit 1
